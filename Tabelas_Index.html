<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<body>
    <h1>Exemplo de Tabela</h1>
    <table border="1">
        <tr>
            <th colspan="3">Produtos de Informática</th>
        </tr>
        <tr>
            <th>Categoria</th>
            <th>Produto</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Computador</td>
            <td>Notebook</td>
            <td>R$ 3.000</td>
        </tr>
        <tr>
            <td rowspan="2">Periféricos</td>
            <td>Mouse</td>
            <td>R$ 50</td>
        </tr>
        <tr>
            <td>Teclado</td>
            <td>R$ 120</td>
        </tr>
    </table>
</body>

</html>
